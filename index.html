{id:1038392,tmdb:1038392,t:'f',g:"Top Lançamentos",n:"Invocação do Mal 4: O Último Ritual",on:"The Conjuring: Last Rites",y:2025,r:'6.9',sy:"O casal de investigadores Ed e Lorraine Warren assume um novo caso de horror sobrenatural que os força a um confronto derradeiro. Para vencer esta batalha final contra as forças malignas, eles são obrigados a encarar seus medos mais profundos, colocando suas vidas em extremo risco.",p:TI+'w500/aXpMqIPndxuDxDA3d2uoNlwc4L.jpg',b:TI+'w1280/i8MupUe4xgmYXoRNAQMYvuoexSU.jpg',em:EMB(1038392),tr:'https://www.youtube.com/embed/_MRJZrXZeQk'},
{id:533533,tmdb:533533,t:'f',g:"Top Lançamentos",n:"Tron: Ares",on:"TRON: Ares",y:2025,r:'6.4',sy:"Um programa de IA altamente avançado chamado Ares (Jared Leto) que é enviado do mundo digital (A Grade) para o mundo real em uma missão perigosa, sendo o primeiro encontro da humanidade com inteligência artificial que transcende o ciberespaço, explorando temas de consciência e a linha tênue entre homem e máquina em meio a uma corrida tecnológica entre duas empresas, Dillinger e Encon",p:TI+'w500/4NO0mmJ7WEU3PcllcogmiQIUecq.jpg',b:TI+'w1280/pUNfHmVqfwRdILhCkU8TdysVOXo.jpg',em:EMB(533533),tr:'https://www.youtube.com/embed/w_oz_FXxHNM'},
{id:1242898,tmdb:1242898,t:'f',g:"Top Lançamentos",n:"Predador: Terras Selvagens",on:"Predator: Badlands",y:2025,r:'7.8',sy:"No futuro, em um planeta remoto, um jovem Predador, rejeitado por seu clã, encontra em Thia uma aliada improvável e embarca em uma jornada traiçoeira em busca do adversário supremo.",p:TI+'w500/f3yLlUrJDdDL8d4nxywyotN45SL.jpg',b:TI+'w1280/82lM4GJ9uuNvNDOEpxFy77uv4Ak.jpg',em:EMB(1242898),tr:'https://www.youtube.com/embed/npogIctHwxY'},
{id:425274,tmdb:425274,t:'f',g:"Top Lançamentos",n:"Truque de Mestre: O 3° Ato",on:"Now You See Me: Now You Don't",y:2025,r:'6.4',sy:"Os Quatro Cavaleiros estão de volta com uma nova geração de ilusionistas e uma trama cheia de reviravoltas, mágicas e surpresas, em um truque que envolve a joia mais valiosa do mundo.",p:TI+'w500/xUddC5HTjMWmClD007QBWR0BLHY.jpg',b:TI+'w1280/ufqytAlziHq5pljKByGJ8IKhtEZ.jpg',em:EMB(425274),tr:'https://www.youtube.com/embed/HxTXXAu3FIk'},
{id:155,tmdb:155,t:'f',g:'Ação',gs:['Ação','Crime','Drama'],n:'Batman: O Cavaleiro das Trevas',on:'The Dark Knight',y:2008,r:'8.5',ri:'9.0',sy:'Batman, com a ajuda do tenente James Gordon e do promotor Harvey Dent, se propõe a desmantelar as organizações criminosas que infestam Gotham. Mas logo surge o Coringa, um gênio do crime que mergulha a cidade na anarquia e leva o Cavaleiro das Trevas ao limite entre herói e justiceiro.',p:TI+'w500/4lj1ikfsSmMZNyfdi8R8Tv5tsgb.jpg',b:TI+'w1280/cfT29Im5VDvjE0RpyKOSdCKZal7.jpg',em:EMB(155),tr:'https://www.youtube.com/embed/8sB1HTghkg4'},

{id:693134,tmdb:693134,t:'f',g:"Top Lançamentos",n:"Duna: Parte Dois",y:2024,r:'8.1',sy:"A jornada de Paul Atreides continua. Ele está determinado a buscar vingança contra aqueles que destruíram sua família e seu lar. Com a ajuda de Chani e dos Fremen, ele embarca em uma jornada espiritual, mística e marcial. Se torna Muad'Dib, o líder messiânico dos Fremen, enquanto luta para evitar um futuro sombrio que ele testemunhou em visões. No entanto, suas ações inadvertidamente desencadeiam uma Guerra Santa em seu nome, que se espalha pelo universo conhecido. Enquanto enfrenta escolhas difíceis entre o amor por Chani e o destino de seu povo, Paul precisa usar suas habilidades e conhecimentos para evitar o terrível futuro que previu.",p:TI+'w500/VMy4UGsI2u3f4fALGeCqCdsQBb.jpg',b:TI+'w1280/eZ239CUp1d6OryZEBPnO2n87gMG.jpg',em:EMB(693134),tr:'https://www.youtube.com/embed/4upWeOF30zI'},
{id:872585,tmdb:872585,t:'f',g:"Top Lançamentos",n:"Oppenheimer",y:2023,r:'8.0',sy:"A história do físico americano J. Robert Oppenheimer, seu papel no Projeto Manhattan e no desenvolvimento da bomba atômica durante a Segunda Guerra Mundial, e o quanto isso mudaria a história do mundo para sempre.",p:TI+'w500/dUPQszWoRSE9FucJTbVp2bwEi9G.jpg',b:TI+'w1280/neeNHeXjMF5fXoCJRsOmkNGC7q.jpg',em:EMB(872585),tr:'https://www.youtube.com/embed/F3OxA9Cz17A'},
{id:533535,tmdb:533535,t:'f',g:"Top Lançamentos",n:"Deadpool & Wolverine",y:2024,r:'7.6',sy:"Um apático Wade Wilson trabalha duro na vida civil. Seus dias como mercenário moralmente flexível, Deadpool, ficaram para trás. Quando seu planeta enfrenta uma ameaça, Wade deve relutantemente vestir-se novamente com um ainda mais relutante... relutante? Mais relutante? Ele deve convencer um Wolverine relutante em... Porra. As sinopses são tão estúpidas.",p:TI+'w500/cJFqqiDYprqExaXatu4AaoMzDG2.jpg',b:TI+'w1280/by8z9Fe8y7p4jo2YlW2SZDnptyT.jpg',em:EMB(533535),tr:'https://www.youtube.com/embed/K6lJSJXSdfI'},
{id:1022789,tmdb:1022789,t:'f',g:"Top Lançamentos",n:"Divertida Mente 2",y:2024,r:'7.5',sy:"\"Divertida Mente 2\", da Disney e da Pixar, retorna à mente da adolescente Riley, e o faz no momento em que a sala de comando está passando por uma demolição repentina para dar lugar a algo totalmente inesperado: novas emoções! Alegria, Tristeza, Raiva, Medo e Nojinho não sabem bem como reagir quando Ansiedade aparece, e tudo indica que ela não está sozinha.",p:TI+'w500/lHKNS35r4RTa9GO72vdadMLxoiV.jpg',b:TI+'w1280/p5ozvmdgsmbWe0H8Xk7Rc8SCwAB.jpg',em:EMB(1022789),tr:'https://www.youtube.com/embed/_OIQFxh8pGc'},
{id:823464,tmdb:823464,t:'f',g:"Top Lançamentos",n:"Godzilla e Kong: O Novo Império",y:2024,r:'7.0',sy:"O poderoso Kong e o temível Godzilla se unem contra uma colossal ameaça mortal escondida no mundo dos humanos, que ameaça a existência de sua espécie e da nossa. Mergulhando profundamente nos mistérios da Ilha da Caveira e nas origens da Terra Oca, o filme irá explorar a antiga batalha de Titãs que ajudou a forjar esses seres extraordinários e os ligou à humanidade para sempre.",p:TI+'w500/fWSGD2yrzz6hscocnMD8AEXIThk.jpg',b:TI+'w1280/gvLG3Fnznkxl4SmYfcK8gUuqxM8.jpg',em:EMB(823464),tr:'https://www.youtube.com/embed/va-7FEpUHVQ'},
{id:27205,tmdb:27205,t:'f',g:"Ação",n:"A Origem",y:2010,r:'8.4',sy:"Cobb é um ladrão habilidoso que comete espionagem corporativa infiltrando-se no subconsciente de seus alvos durante o estado de sono. Impedido de retornar para sua família, ele recebe a oportunidade de se redimir ao realizar uma tarefa aparentemente impossível: plantar uma ideia na mente do herdeiro de um império. Para realizar o crime perfeito, ele conta com a ajuda do parceiro Arthur, o discreto Eames e a arquiteta de sonhos Ariadne. Juntos, eles correm para que o inimigo não antecipe seus passos.",p:TI+'w500/9e3Dz7aCANy5aRUQF745IlNloJ1.jpg',b:TI+'w1280/8ZTVqvKDQ8emSGUEMjsS4yHAwrp.jpg',em:EMB(27205),tr:'https://www.youtube.com/embed/R_VX0e0PX90'},
{id:299534,tmdb:299534,t:'f',g:"Ação",n:"Vingadores: Ultimato",y:2019,r:'8.2',sy:"Após os eventos devastadores de \"Vingadores: Guerra Infinita\", o universo está em ruínas devido aos esforços do Titã Louco, Thanos. Com a ajuda de aliados remanescentes, os Vingadores devem se reunir mais uma vez a fim de desfazer as ações de Thanos e restaurar a ordem no universo de uma vez por todas, não importando as consequências.",p:TI+'w500/9fRX8UKlIW7Lb9GqNsJVakWWFCi.jpg',b:TI+'w1280/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg',em:EMB(299534),tr:'https://www.youtube.com/embed/HiAzj9HZQnE'},
{id:245891,tmdb:245891,t:'f',g:"Ação",n:"John Wick - De Volta ao Jogo",y:2014,r:'7.5',sy:"John Wick é um lendário assassino de aluguel aposentado, lidando com o luto após perder o grande amor de sua vida. Quando um gângster invade sua casa, mata seu cachorro e rouba seu carro, ele é forçado a voltar à ativa e inicia sua vingança.",p:TI+'w500/lBcQGk1ygGM2wYmpypFrPp0YohN.jpg',b:TI+'w1280/ff2ti5DkA9UYLzyqhQfI2kZqEuh.jpg',em:EMB(245891),tr:'https://www.youtube.com/embed/hPYz9Yz6ekA'},
{id:603,tmdb:603,t:'f',g:"Ação",n:"Matrix",y:1999,r:'8.3',sy:"O jovem programador Thomas Anderson é atormentado por estranhos pesadelos em que está sempre conectado por cabos a um imenso sistema de computadores do futuro. À medida que o sonho se repete, ele começa a desconfiar da realidade. Thomas conhece os misteriosos Morpheus e Trinity e descobre que é vítima de um sistema inteligente e artificial chamado Matrix, que manipula a mente das pessoas e cria a ilusão de um mundo real enquanto usa os cérebros e corpos dos indivíduos para produzir energia.",p:TI+'w500/lDqMDI3xpbB9UQRyeXfei0MXhqb.jpg',b:TI+'w1280/tlm8UkiQsitc8rSuIAscQDCnP8d.jpg',em:EMB(603),tr:'https://www.youtube.com/embed/mPYfd6PCmYY'},
{id:98,tmdb:98,t:'f',g:"Ação",n:"Gladiador",y:2000,r:'8.2',sy:"Nos dias finais do reinado de Marcus Aurelius, o imperador desperta a ira de seu filho Commodus ao tornar pública sua predileção em deixar o trono para Maximus, o comandante do exército romano. Sedento pelo poder, Commodus mata seu pai, assume a coroa e ordena a morte de Maximus, que consegue fugir antes de ser pego e passa a se esconder sob a identidade de um escravo e gladiador do Império Romano.",p:TI+'w500/4DUClyGA6OqjXv6yC0Imf6THGfp.jpg',b:TI+'w1280/Ar7QuJ7sJEiC0oP3I8fKBKIQD9u.jpg',em:EMB(98),tr:'https://www.youtube.com/embed/AVPCzVHLAYY'},
{id:694,tmdb:694,t:'f',g:"Terror",n:"O Iluminado",y:1980,r:'8.2',sy:"Durante o inverno, um homem é contratado para ficar como vigia em um hotel no Colorado e vai para lá com a esposa e seu filho. Porém, o contínuo isolamento começa a lhe causar problemas mentais sérios e ele vai se tornado cada vez mais agressivo e perigoso, ao mesmo tempo que seu filho passa a ter visões de acontecimentos ocorridos no passado, que também foram causados pelo isolamento excessivo.",p:TI+'w500/47BdQqDWnj3VIzpH9bd2agho2PN.jpg',b:TI+'w1280/AdKA2F1SzYPhSZdEbjH1Zh75UVQ.jpg',em:EMB(694),tr:'https://www.youtube.com/embed/jAE7dNurHR4'},
{id:346364,tmdb:346364,t:'f',g:"Terror",n:"It: A Coisa",y:2017,r:'7.2',sy:"Na cidade de Derry, no Maine, sete jovens se juntam para combater uma criatura sobrenatural que está assombrando a sua cidade por séculos. Chamado de Pennywise – O Palhaço Dançarino, a Coisa é um monstro de força absoluta que toma a forma dos medos mais horrorosos das pessoas. Ameaçados por seus piores pesadelos, a única maneira dos jovens amigos sobreviverem à Coisa é se continuarem juntos.",p:TI+'w500/uYxz0lIiNgErrPhQbSjUdwYxtFc.jpg',b:TI+'w1280/qVGpxnjrGlHaSTCqTQI6viBDSfp.jpg',em:EMB(346364),tr:'https://www.youtube.com/embed/UllUiLEXB_g'},
{id:138843,tmdb:138843,t:'f',g:"Terror",n:"Invocação do Mal",y:2013,r:'7.5',sy:"Harrisville, Rhode Island, Estados Unidos, 1968. Os investigadores paranormais Ed e Lorraine Warren trabalham para ajudar uma família aterrorizada por uma presença sombria em sua fazenda. Forçados a confrontar uma entidade poderosa, os Warrens se vêem presos no caso mais aterrorizante de suas vidas. Baseado numa história real.",p:TI+'w500/1NxHKZW5DPbUFtbF3MxbdSyxRqU.jpg',b:TI+'w1280/ecKQlAEG95k62SMGhvX83oEqANK.jpg',em:EMB(138843),tr:'https://www.youtube.com/embed/BW3BSg2Z0b8'},
{id:493922,tmdb:493922,t:'f',g:"Terror",n:"Hereditário",y:2018,r:'7.3',sy:"Após a morte da reclusa avó, a família Graham começa a desvendar algumas coisas. Mesmo após a partida da matriarca, ela permanece como se fosse uma sombra sobre a família, especialmente sobre a solitária neta adolescente, Charlie, por quem ela sempre manteve uma fascinação não usual. Com um crescente terror tomando conta da casa, a família explora lugares mais escuros para escapar do infeliz destino que herdaram.",p:TI+'w500/x9tUYQj6WrdVwoKimSdoMzkDABS.jpg',b:TI+'w1280/pS9Aub8MPyQbENblGD8mHeaqMuv.jpg',em:EMB(493922),tr:'https://www.youtube.com/embed/Ui13PlmyZhQ'},
{id:419430,tmdb:419430,t:'f',g:"Terror",n:"Corra!",y:2017,r:'7.6',sy:"Agora que Chris e sua namorada, Rose, chegaram à fase de conhecer os pais no namoro, ela o convida para um fim de semana no interior com Missy e Dean. A princípio, Chris acha que o comportamento excessivamente agradável dos dois como tentativas nervosas de lidar com o relacionamento inter-racial da filha, mas, conforme o fim de semana avança, uma série de descobertas cada vez mais perturbadoras o levam a uma verdade que ele jamais poderia ter imaginado.",p:TI+'w500/A0RoSZh8PEYJgDMgM2EV7Ycz3dR.jpg',b:TI+'w1280/bBQHALHRAaaORlPNXv7fNcRXYdx.jpg',em:EMB(419430),tr:'https://www.youtube.com/embed/cMM9PbwgO4Y'},
{id:120467,tmdb:120467,t:'f',g:"Comédia",n:"O Grande Hotel Budapeste",y:2014,r:'8.0',sy:"No período entre as duas guerras mundiais, o famoso gerente de um hotel europeu conhece um jovem empregado e os dois tornam-se melhores amigos. Entre as aventuras vividas pelos dois, constam o roubo de um famoso quadro do Renascimento, a batalha pela grande fortuna de uma família e as transformações históricas durante a primeira metade do século XX.",p:TI+'w500/yabOguSrb8ffUXCkI6t8Rw7xtSh.jpg',b:TI+'w1280/jK65srQczOKTpW62wPxwwKztGgE.jpg',em:EMB(120467),tr:'https://www.youtube.com/embed/sF7hAbQR7kk'},
{id:8363,tmdb:8363,t:'f',g:"Comédia",n:"Superbad: É Hoje",y:2007,r:'7.3',sy:"Os estudantes adolescentes Seth e Evan têm grandes esperanças para uma festa de formatura. Os adolescentes co-dependentes pretendem beber e conquistar garotas para que eles possam se tornar parte da multidão popular da escola, mas a ansiedade de separação e dois policiais entediados complicam a auto-missão proclamada dos amigos.",p:TI+'w500/rABcQMa8m67EJslknSlMfE3BP8L.jpg',b:TI+'w1280/coru98UcFBzJIU7bxZguxaePgu0.jpg',em:EMB(8363),tr:'https://www.youtube.com/embed/MuhWxdD0qno'},
{id:109443,tmdb:109443,t:'f',g:"Comédia",n:"Tudo por um Furo",y:2013,r:'6.1',sy:"Depois de perder seu emprego para sua esposa e colega, Ron reúne o time do noticiário e investe contra um novo rival. Será que o maior âncora do mundo vai ser esmagado pelo peso de seu próprio ego (e seu cabelo de salão)?",p:TI+'w500/zt3gC0tFG4YnyBiwf18blTeRoly.jpg',b:TI+'w1280/hYY7wC3vuwSmoRdcMalVMjPC0a0.jpg',em:EMB(109443),tr:'https://www.youtube.com/embed/6VdGI5-z_hg'},
{id:18785,tmdb:18785,t:'f',g:"Comédia",n:"Se Beber, Não Case!",y:2009,r:'7.3',sy:"Dois dias antes de seu casamento, Doug e três amigos vão de carro até Las Vegas para uma louca e memorável despedida de solteiro. Quando os três padrinhos acordam na manhã seguinte, eles não conseguem se lembrar de nada e notam que Doug desapareceu. Com pouco tempo de sobra, os amigos tentam refazer a noite anterior e encontrar Doug para que possam levá-lo de volta a Los Angeles a tempo de chegar ao altar.",p:TI+'w500/m0tQyMdp3fy5ooUOQkJMd1fQKBJ.jpg',b:TI+'w1280/iuRVt8tFiXDPGgzavhuSa3QHRxD.jpg',em:EMB(18785),tr:'https://www.youtube.com/embed/Cm7eAq1PaXE'},
{id:771,tmdb:771,t:'f',g:"Comédia",n:"Esqueceram de Mim",y:1990,r:'7.5',sy:"Uma família de Chicago planeja passar o Natal em Paris. Porém, em meio às confusões da viagem, um dos filhos, Kevin, acaba esquecido em casa. O garoto de apenas oito anos é obrigado a se virar sozinho e defender a casa de dois insistentes ladrões.",p:TI+'w500/AeaRJ5a4SxFJSo4AHOLKpr3PEyi.jpg',b:TI+'w1280/ih2xVgeMS8R5WUetYE8Mr9hVTlB.jpg',em:EMB(771),tr:'https://www.youtube.com/embed/sptc2IcHnc4'},
{id:157336,tmdb:157336,t:'f',g:"Ficção Científica",n:"Interestelar",y:2014,r:'8.5',sy:"As reservas naturais da Terra estão chegando ao fim e um grupo de astronautas recebe a missão de verificar possíveis planetas para receberem a população mundial, possibilitando a continuação da espécie. Cooper é chamado para liderar o grupo e aceita a missão sabendo que pode nunca mais ver os filhos. Ao lado de Brand, Jenkins e Doyle, ele seguirá em busca de um novo lar.",p:TI+'w500/tR1XVa5bxgdh2bRw2u0DzrgkO2l.jpg',b:TI+'w1280/8sNiAPPYU14PUepFNeSNGUTiHW.jpg',em:EMB(157336),tr:'https://www.youtube.com/embed/i6avfCqKcQo'},
{id:438631,tmdb:438631,t:'f',g:"Ficção Científica",n:"Duna",y:2021,r:'7.8',sy:"Em um futuro distante, planetas são comandados por casas nobres que fazem parte de um império feudal intergalático. Paul Atreides é um jovem cuja família toma o controle do planeta deserto Arrakis, também conhecido como Duna. A única fonte da especiaria Melange, a substância mais importante do cosmos, Arrakis se mostra ser um planeta nem um pouco fácil de governar.",p:TI+'w500/uzERcfV2rSHNhW5eViQiO9hNiA7.jpg',b:TI+'w1280/jYEW5xZkZk2WTrdbMGAPFuBqbDc.jpg',em:EMB(438631),tr:'https://www.youtube.com/embed/vETzL4y5n-g'},
{id:335984,tmdb:335984,t:'f',g:"Ficção Científica",n:"Blade Runner 2049",y:2017,r:'7.6',sy:"Trinta anos após os acontecimentos do primeiro filme, um novo blade runner, o oficial K da polícia de Los Angeles, desenterra um segredo há muito enterrado que tem o potencial de mergulhar o que resta da sociedade no caos. A descoberta de K o leva a uma busca para encontrar Rick Deckard, um ex-blade runner do LAPD que está desaparecido há 30 anos.",p:TI+'w500/49pANIZXRAdHUiWjjBv4vxPeqRC.jpg',b:TI+'w1280/gNdLJU9TxrpGx4dkZidjys3fyy0.jpg',em:EMB(335984),tr:'https://www.youtube.com/embed/xGwe7D0RKWc'},
{id:78,tmdb:78,t:'f',g:"Ficção Científica",n:"Blade Runner: O Caçador de Andróides",y:1982,r:'7.9',sy:"No início do século 21, uma grande corporação desenvolve um robô que é mais forte e ágil que o ser humano e se equiparando em inteligência. São conhecidos como \"replicantes\" e utilizados como escravos na colonização e exploração de outros planetas. Mas, quando um grupo dos robôs mais evoluídos provoca um motim em uma colônia fora da Terra, este incidente faz os replicantes serem considerados ilegais na Terra, sob pena de morte. A partir de então, policiais de um esquadrão de elite conhecidos como \"Blade Runner\", têm ordem de atirar para matar em replicantes encontrados na Terra. Mas tal ato não é chamado de \"execução\" e sim de \"remoção\". Até que, em novembro de 2019, em Los Angeles, quando cinco replicantes chegam à Terra, o ex-Blade Runner, Deckard, é encarregado de caçá-los.",p:TI+'w500/y5ibL0vFnzsRiIHosw0WOfHtIj1.jpg',b:TI+'w1280/2spEHYDcyE9r9mS7AFEscfKVDzO.jpg',em:EMB(78),tr:'https://www.youtube.com/embed/qoEyZoOTtss'},
{id:329865,tmdb:329865,t:'f',g:"Ficção Científica",n:"A Chegada",y:2016,r:'7.6',sy:"Quando seres interplanetários deixam marcas na Terra, a Dra. Louise Banks, uma linguista especialista no assunto, é procurada por militares para traduzir os sinais e desvendar se os alienígenas representam uma ameaça. No entanto, a resposta para todas as perguntas e mistérios coloca em risco  a vida de Louise e a de toda a humanidade.",p:TI+'w500/3rDwbFpn6z5HJUgDjpfhEePx8VI.jpg',b:TI+'w1280/8MUZz7oPXQftFTslZpRP3CVMOoq.jpg',em:EMB(329865),tr:'https://www.youtube.com/embed/isWwUJf4KEA'},

{id:361743,tmdb:361743,t:'f',g:"Ação",n:"Top Gun: Maverick",on:"Top Gun: Maverick",y:2022,r:'8.2',sy:"Depois de mais de 30 anos de serviço como um dos principais aviadores da Marinha, Pete \"Maverick\" Mitchell está de volta, rompendo os limites como um piloto de testes corajoso. No mundo contemporâneo das guerras tecnológicas, Maverick enfrenta drones e prova que o fator humano ainda é essencial.",p:TI+'w500/kPbuLGVSJHATkW9fX9L3h1wM0Pa.jpg',b:TI+'w1280/AaV1YIdWKnjAIAOe8UUKBFm327v.jpg',em:EMB(361743),tr:'https://www.youtube.com/embed/6T_WClIAfA4'},
{id:76341,tmdb:76341,t:'f',g:"Ação",n:"Mad Max: Estrada da Fúria",on:"Mad Max: Fury Road",y:2015,r:'7.6',sy:"Em um mundo apocalíptico, Max Rockatansky acredita que a melhor forma de sobreviver é não depender de ninguém. Porém, após ser capturado pelo tirano Immortan Joe e seus rebeldes, Max se vê no meio de uma guerra mortal, iniciada pela imperatriz Furiosa que tenta salvar um grupo de garotas. Também tentando fugir, Max aceita ajudar Furiosa. Dessa vez, o tirano Joe está ainda mais implacável pois teve algo insubstituível roubado.",p:TI+'w500/tH64gzAHDFg7EFcgfkkZyHdGM5P.jpg',b:TI+'w1280/gqrnQA6Xppdl8vIb2eJc58VC1tW.jpg',em:EMB(76341),tr:'https://www.youtube.com/embed/CYiq9yfFGBg'},
{id:353081,tmdb:353081,t:'f',g:"Ação",n:"Missão: Impossível - Efeito Fallout",on:"Mission: Impossible - Fallout",y:2018,r:'7.5',sy:"Em uma perigosa tarefa para recuperar plutônio roubado, Ethan Hunt opta por salvar sua equipe em vez de completar a missão. Com isso, armas nucleares caem nas mãos de agentes altamente qualificados e que pertencem a uma rede mortal que deseja destruir a civilização. Agora, com o mundo em risco, Ethan e sua equipe da IMF são forçados a aliar-se a um obstinado agente da CIA.",p:TI+'w500/i273qQubszItr11lQNMFWnYP4J1.jpg',b:TI+'w1280/5jnoAA74Qwb5w6B9FMvnc20n6Ie.jpg',em:EMB(353081),tr:'https://www.youtube.com/embed/FTjuC70Q5Zs'},
{id:634649,tmdb:634649,t:'f',g:"Ação",n:"Homem-Aranha: Sem Volta Para Casa",on:"Spider-Man: No Way Home",y:2021,r:'7.9',sy:"Peter Parker é desmascarado e não consegue mais separar sua vida normal dos grandes riscos de ser um super-herói. Quando ele pede ajuda ao Doutor Estranho, os riscos se tornam ainda mais perigosos, e o forçam a descobrir o que realmente significa ser o Homem-Aranha...",p:TI+'w500/xaKydnMw6wR1MBAjS5seGPVusbs.jpg',b:TI+'w1280/iQFcwSGbZXMkeyKrxbPnwnRo5fl.jpg',em:EMB(634649),tr:'https://www.youtube.com/embed/rzOvXvBNzMc'},
{id:299536,tmdb:299536,t:'f',g:"Ação",n:"Vingadores: Guerra Infinita",on:"Avengers: Infinity War",y:2018,r:'8.2',sy:"Homem de Ferro, Thor, Hulk e os Vingadores se unem para combater seu inimigo mais poderoso, o maligno Thanos. Em uma missão para coletar todas as seis pedras infinitas, Thanos planeja usá-las para infligir sua vontade maléfica sobre a realidade.",p:TI+'w500/A4kvp7vY1BDLrrQIagRCffLKj1t.jpg',b:TI+'w1280/mDfJG3LC3Dqb67AZ52x3Z0jU0uB.jpg',em:EMB(299536),tr:'https://www.youtube.com/embed/RP-O7wNJdbM'},
{id:603692,tmdb:603692,t:'f',g:"Ação",n:"John Wick 4: Baba Yaga",on:"John Wick: Chapter 4",y:2023,r:'7.7',sy:"Com o preço por sua cabeça cada vez maior, John Wick leva sua luta contra a alta mesa global enquanto procura os jogadores mais poderosos do submundo, de Nova York a Paris, de Osaka a Berlim.",p:TI+'w500/rXTqhpkpj6E0YilQ49PK1SSqLhm.jpg',b:TI+'w1280/7I6VUdPj6tQECNHdviJkUHD2u89.jpg',em:EMB(603692),tr:'https://www.youtube.com/embed/Te3L5rT1Q8w'},
{id:284054,tmdb:284054,t:'f',g:"Ação",n:"Pantera Negra",on:"Black Panther",y:2018,r:'7.4',sy:"O príncipe T'Challa retorna a Wakanda para ser coroado rei. Assumindo o manto de Pantera Negra, ele vai à caça de um vilão que roubou um precioso metal de seu país.",p:TI+'w500/ubXNpxL2ASSzY0f8Hxv08pOsV2L.jpg',b:TI+'w1280/b6ZJZHUdMEFECvGiDpJjlfUWela.jpg',em:EMB(284054),tr:'https://www.youtube.com/embed/WGGBiHhvUrE'},
{id:1726,tmdb:1726,t:'f',g:"Ação",n:"Homem de Ferro",on:"Iron Man",y:2008,r:'7.7',sy:"Tony Stark é um industrial bilionário, que também é um brilhante inventor. Ao ser sequestrado ele é obrigado por terroristas a construir uma arma devastadora mas, ao invés disto, constrói uma armadura de alta tecnologia que permite que fuja de seu cativeiro. A partir de então ele passa a usá-la para combater o crime, sob o alter ego do Homem de Ferro.",p:TI+'w500/mqN7RxojEiPoh3FTSTwOtwg7KAu.jpg',b:TI+'w1280/cKvDv2LpwVEqbdXWoQl4XgGN6le.jpg',em:EMB(1726),tr:'https://www.youtube.com/embed/j_Ez4QVs_1g'},
{id:562,tmdb:562,t:'f',g:"Ação",n:"Duro de Matar",on:"Die Hard",y:1988,r:'7.8',sy:"O policial de Nova York John McClane está visitando sua família no Natal. Ele participa de uma confraternização de fim de ano na sede da empresa japonesa em que a esposa trabalha. A festa é interrompida por terroristas que invadem o edifício de luxo. McClane não demora a perceber que não há ninguém para salvá-los, a não ser ele próprio.",p:TI+'w500/2PD0HHoyVVAEUhep9JhlKtgyl8m.jpg',b:TI+'w1280/bvk2AAH64lP2YZs02Q3jskfHT8j.jpg',em:EMB(562),tr:'https://www.youtube.com/embed/TotSHi0ViUc'},
{id:4232,tmdb:4232,t:'f',g:"Terror",n:"Pânico",on:"Scream",y:1996,r:'7.4',sy:"Após uma série de mortes misteriosas, um grupo de amigos são ameaçados por um assassino. Em uma mistura de emoções fortes e muitos sustos, aqui a única coisa que se pode ter certeza é que todos são vítimas e todos são suspeitos.",p:TI+'w500/cJj2gYzkPFSqYGGOhfLgeANlXkB.jpg',b:TI+'w1280/4w6nQYAY0eb7B0VVRDXilXcgAUV.jpg',em:EMB(4232),tr:'https://www.youtube.com/embed/Xlut875doho'},
{id:948,tmdb:948,t:'f',g:"Terror",n:"Halloween - A Noite do Terror",on:"Halloween",y:1978,r:'7.6',sy:"Na noite de Halloween de 1963, Michael Myers, de seis anos, assassina brutalmente sua irmã. Preso em uma instituição para doentes mentais sob os cuidados do dr. Sam Loomis, Michael cresce apenas para odiar. Em outubro de 1978, ele foge do hospital, seguido pelo dr. Loomis, que sabe que Michael vai matar novamente. O psicopata passa a perseguir a adolescente Laurie Strode e seus amigos, e prepara seu ataque mortal para a noite de Halloween.",p:TI+'w500/mVQ8Lb7FhQXPqkQv0QCNbEwp9a6.jpg',b:TI+'w1280/sHI9xlFRWCJ38AIIfOqnGjuEvXz.jpg',em:EMB(948),tr:'https://www.youtube.com/embed/NT0loXUv-ks'},
{id:1091,tmdb:1091,t:'f',g:"Terror",n:"O Enigma de Outro Mundo",on:"The Thing",y:1982,r:'8.1',sy:"Na remota Antártida, um grupo de cientistas americanos é perturbado em sua base quando, de um helicóptero, alguém atira em um cão do acampamento. À medida que socorrem o cão baleado, o bicho começa a atacar os cientistas e os outros cachorros e logo eles descobrem que o animal pode assumir a forma de suas vítimas. Isto significa que membros da equipe podem ser mortos e a cópia assumir o lugar deles. Com isso, um piloto e um médico precisam capturar a fera antes que seja tarde demais.",p:TI+'w500/bazlgJAKWCBF7OllC3JtyJ2DV1n.jpg',b:TI+'w1280/r9leYNa8nTRCceZrZhP1DXkgKVb.jpg',em:EMB(1091),tr:'https://www.youtube.com/embed/8HuMF5IsILU'},
{id:447332,tmdb:447332,t:'f',g:"Terror",n:"Um Lugar Silencioso",on:"A Quiet Place",y:2018,r:'7.4',sy:"Em uma fazenda dos Estados Unidos, uma família do meio-oeste é perseguida por uma entidade fantasmagórica assustadora. Para se protegerem, eles devem permanecer em silêncio absoluto, a qualquer custo, pois o perigo é ativado pela percepção do som.",p:TI+'w500/jk1LYcbiuUr0tv37cVcmp4u9KcN.jpg',b:TI+'w1280/nHRUtBwFNnNN70vcQ7lAsjc2T6S.jpg',em:EMB(447332),tr:'https://www.youtube.com/embed/pbg3r13Y4To'},
{id:9552,tmdb:9552,t:'f',g:"Terror",n:"O Exorcista",on:"The Exorcist",y:1973,r:'7.8',sy:"Em Georgetown, Washington, uma atriz vai gradativamente tomando consciência que a sua filha de doze anos está tendo um comportamento completamente assustador. Deste modo, ela pede ajuda a um padre, que também um psiquiatra, e este chega a conclusão de que a garota está possuída pelo demônio. Ele solicita então a ajuda de um segundo sacerdote, especialista em exorcismo, para tentar livrar a menina desta terrível possessão.",p:TI+'w500/bYTMDg3eGFuO7emXbQip02a8zvQ.jpg',b:TI+'w1280/xcjJ5khg2yzOa282mza39Lbrm7j.jpg',em:EMB(9552),tr:'https://www.youtube.com/embed/a8g3h2JaVE4'},
{id:565,tmdb:565,t:'f',g:"Terror",n:"O Chamado",on:"The Ring",y:2002,r:'6.7',sy:"Rachel Keller é uma jornalista que decide investigar a misteriosa morte de sua sobrinha. Ela percebe a relação da morte dela e de várias outras mortes com um estranho vídeo, que faz com que todas as pessoas que o assistam morram exatamente sete dias depois. Intrigada com a história, ela agora precisa descobrir um meio que impeça que a profecia se realize, já que ela e seu filho assistiram ao vídeo.",p:TI+'w500/4skN151KEKtJQSLJ7zkWSDGE0DJ.jpg',b:TI+'w1280/6tuNQ16hC4Qp7wjTweKzUnnLBkI.jpg',em:EMB(565),tr:'https://www.youtube.com/embed/CG7BAY6_hsw'},
{id:760104,tmdb:760104,t:'f',g:"Terror",n:"X: A Marca da Morte",on:"X",y:2022,r:'6.7',sy:"Em 1979, um grupo de jovens cineastas se propôs a fazer um filme adulto na zona rural do Texas, mas quando seus solitários e idosos anfitriões os pegam em flagrante, o elenco se vê lutando por suas vidas.",p:TI+'w500/4BarWJRYFB5fN7LsJI9U2ul79hB.jpg',b:TI+'w1280/o375tDNib7tihlkWdtLW1fQhNL1.jpg',em:EMB(760104),tr:'https://www.youtube.com/embed/sIAvh4sfgEw'},
{id:609,tmdb:609,t:'f',g:"Terror",n:"Poltergeist: O Fenômeno",on:"Poltergeist",y:1982,r:'7.2',sy:"\"Eles estão aqui\". E parecem amistosos no começo, tentando equilibrar cadeiras na cozinha da casa da família Freenlings, num subúrbio americano. Então, as coisas tornam-se tenebrosas. Uma tempestade rompe, o ataque de uma árvore, a pequena Carol Anne Freeling desaparece num espectro sinistro. E assim que sua família confronta uma reação em cadeia de horror e luta para trazer sua caçula de volta, alguma outra coisa está aqui também: um novo marco nas histórias de fantasmas em Hollywood.",p:TI+'w500/4eMN3GANH5GG4kXdHkrTZEUuQ9M.jpg',b:TI+'w1280/bvkPno6U02lLyvPWCnmibq4eIaN.jpg',em:EMB(609),tr:'https://www.youtube.com/embed/RtKn4rHAMAg'},
{id:377,tmdb:377,t:'f',g:"Terror",n:"A Hora do Pesadelo",on:"A Nightmare on Elm Street",y:1984,r:'7.4',sy:"Um grupo de adolescentes tem pesadelos horríveis, onde são atacados por um homem deformado com garras de aço. Ele apenas aparece durante o sono e, para escapar, é preciso acordar. Os crimes vão ocorrendo seguidamente, até que se descobre que o ser misterioso é na verdade Freddy Krueger, um homem que molestou crianças na rua Elm e que foi queimado vivo pela vizinhança. Agora Krueger pode retornar para se vingar daqueles que o mataram, através do sono.",p:TI+'w500/8cXxfVhSdTL1tC5ivC0mX74QQyI.jpg',b:TI+'w1280/nzSjTiecdosBfwMGAdpt9CxltCI.jpg',em:EMB(377),tr:'https://www.youtube.com/embed/CBcVZcornjI'},
{id:1008042,tmdb:1008042,t:'f',g:"Terror",n:"Fale Comigo",on:"Talk to Me",y:2023,r:'7.1',sy:"Quando um grupo de amigos descobre como conjurar espíritos usando uma antiga mão embalsamada, eles ficam viciados na nova emoção. Até que um deles vai longe demais e abre a porta para o mundo espiritual.",p:TI+'w500/7U3lC4YnHD8zpeoxbY6Hsj9jyeu.jpg',b:TI+'w1280/46Os8U0DEPmI0OnvKDxucl6SLVZ.jpg',em:EMB(1008042),tr:'https://www.youtube.com/embed/OlDwEnTuNjY'},
{id:933260,tmdb:933260,t:'f',g:"Terror",n:"A Substância",on:"The Substance",y:2024,r:'7.1',sy:"Uma estrela em declínio descobre uma substância misteriosa que lhe permite criar uma versão mais jovem e perfeita de si mesma. No entanto, o que parece ser uma solução milagrosa para recuperar sua glória logo se transforma em um pesadelo perturbador quando as consequências desta decisão começam a se manifestar de formas sombrias e irreversíveis.",p:TI+'w500/vWeOgzlhnP1sS23H3rzctGHB9Nb.jpg',b:TI+'w1280/bVSOgrxasVJF6V71T7v2KfBRSzu.jpg',em:EMB(933260),tr:'https://www.youtube.com/embed/AoRa8-BUYjI'},
{id:37165,tmdb:37165,t:'f',g:"Comédia",n:"O Show de Truman: O Show da Vida",on:"The Truman Show",y:1998,r:'8.2',sy:"Truman Burbank é um pacato vendedor de seguros que leva um vida simples com sua esposa Meryl Burbank. Porém algumas coisas ao seu redor fazem com que ele passe a estranhar sua cidade, seus supostos amigos e até sua mulher. Após conhecer a misteriosa Lauren, ele fica intrigado e acaba descobrindo que toda sua vida foi monitorada por câmeras e transmitida em rede nacional.",p:TI+'w500/3mEoGWyJCZTSoYyjFD3gFd6hzU4.jpg',b:TI+'w1280/rmiG2uwcNoGFmBKMoa1pIcf514L.jpg',em:EMB(37165),tr:'https://www.youtube.com/embed/zFThyNmLFr8'},
{id:115,tmdb:115,t:'f',g:"Comédia",n:"O Grande Lebowski",on:"The Big Lebowski",y:1998,r:'7.9',sy:"Em Los Angeles, 1991, Jeff Lebowski, mais conhecido como \"O Cara\", é um desocupado que gasta o seu tempo ouvindo rock dos anos 1960 e jogando boliche. Mas sua vida vai mudar. Confundido com um milionário da Califórnia, ele se vê envolvido com bandidos da pesada, advogados atrapalhados, detetives, sequestradores e, como se não bastasse, com a polícia. Com sua vida ameaçada, Lebowski procura seu amigo Walter, um veterano da Guerra do Vietnã que irá ajudá-lo com seus métodos pouco ortodoxos.",p:TI+'w500/d1Qxhvg2l3f2ow1Q6WAkOTkIWv2.jpg',b:TI+'w1280/77ElMccPnTMPouRxSdbJ4nEjf69.jpg',em:EMB(115),tr:'https://www.youtube.com/embed/GiwMMziJdqg'},
{id:10625,tmdb:10625,t:'f',g:"Comédia",n:"Meninas Malvadas",on:"Mean Girls",y:2004,r:'7.2',sy:"Criada na selva africana por seus pais zoólogos, Cady acha que sabe tudo sobre \"sobrevivência dos mais bem dotados\". Mas a lei da selva toma um significado totalmente novo, quando a garota, entra na escola pública.",p:TI+'w500/iV7YxvjdmRZo0amjGA2BZW5kkAu.jpg',b:TI+'w1280/nP3y0TkR6XniFs9J53qQkg4Bnnk.jpg',em:EMB(10625),tr:'https://www.youtube.com/embed/EMzEmGfTuM4'},
{id:8467,tmdb:8467,t:'f',g:"Comédia",n:"Debi & Lóide: Dois Idiotas em Apuros",on:"Dumb and Dumber",y:1994,r:'6.7',sy:"Dois amigos debilóides vão para Aspen, no estado do Colorado, para tentar devolver uma maleta esquecida pela passageira da limusine que um deles estava dirigindo para o aeroporto. Sem saber que na mala havia uma quantia enorme de dinheiro, que serviria para pagar o resgate de um sequestro, os dois acabam sendo perseguidos pela polícia e por assassinos profissionais.",p:TI+'w500/3pJwSxO8L2MOGXGaJIOAAq35LAP.jpg',b:TI+'w1280/8uBTDGRcNHhYChcoazP5rleRME7.jpg',em:EMB(8467),tr:'https://www.youtube.com/embed/QXMkxujaq7Y'},
{id:2108,tmdb:2108,t:'f',g:"Comédia",n:"Clube dos Cinco",on:"The Breakfast Club",y:1985,r:'7.7',sy:"Em virtude de terem cometido pequenos delitos, cinco adolescentes são confinados no colégio em um sábado com a tarefa de escrever uma redação de mil palavras sobre o que pensam de si mesmos. Apesar de serem pessoas completamente diferentes, enquanto o dia transcorre, eles passam a aceitar uns aos outros, fazem várias confissões e se tornam amigos.",p:TI+'w500/pFVjzMlJjjyTa7pDaFUzsLF6PsW.jpg',b:TI+'w1280/s5HDOmFZaPVQFjk9BxxDrLu1T0g.jpg',em:EMB(2108),tr:'https://www.youtube.com/embed/EmqkaxOw6_o'},
{id:9377,tmdb:9377,t:'f',g:"Comédia",n:"Curtindo a Vida Adoidado",on:"Ferris Bueller's Day Off",y:1986,r:'7.6',sy:"No último semestre do curso do colégio, o estudante Ferris Bueller (Matthew Broderick) sente um incontrolável desejo de matar aula e planeja um grande passeio na cidade com a namorada Sloane Peterson (Mia Sara) e com seu melhor amigo Cameron Frye (Alan Ruck) à bordo de uma Ferrari. Só que, para poder realizar seu desejo, ele precisa escapar do diretor do colégio Ed Rooney (Jeffrey Jones) e de sua própria irmã Jeanie Bueller (Jennifer Grey).",p:TI+'w500/okPQfh1x7d4i1UpZUmdqADpcDSd.jpg',b:TI+'w1280/jehzP4JKiFzgTWIaASLFOJocJke.jpg',em:EMB(9377),tr:'https://www.youtube.com/embed/GDttaV80_BM'},
{id:346698,tmdb:346698,t:'f',g:"Comédia",n:"Barbie",on:"Barbie",y:2023,r:'6.9',sy:"No mundo mágico das Barbies, \"Barbieland\", uma das bonecas começa a perceber que não se encaixa como as outras. Depois de ser expulsa, ela parte para uma aventura no \"mundo real\", onde descobre que a beleza está no interior de cada um.",p:TI+'w500/pP12F7Gutn6CpHYaIPBlDRHlMlk.jpg',b:TI+'w1280/1esAE8sLJRWWFsLLeh5r3g2WanI.jpg',em:EMB(346698),tr:'https://www.youtube.com/embed/MQHzdpnOq48'},
{id:1593,tmdb:1593,t:'f',g:"Comédia",n:"Uma Noite no Museu",on:"Night at the Museum",y:2006,r:'6.6',sy:"Quando Larry Daley é contratado como guarda noturno no museu, ele logo descobre que todos os seres do museu ganham vida após o pôr-do-sol. Logo de cara, Larry se vê frente a frente com um brincalhão esqueleto de T. Rex, mas também é cercado por exércitos de minúsculos soldados romanos e por caubóis armados. Para completar, há um macaquinho endiabrado que o deixa maluco! Mas talvez ele consiga descobrir um modo de controlar o caos e tornar-se um herói aos olhos de seu filho.",p:TI+'w500/Pca1hVNgPAUcp6zVHldlboh80R.jpg',b:TI+'w1280/1ZVlzOBYCggLzvVYHK7Im6LohjC.jpg',em:EMB(1593),tr:'https://www.youtube.com/embed/Ltba1_-tRT4'},
{id:10719,tmdb:10719,t:'f',g:"Comédia",n:"Um Duende em Nova York",on:"Elf",y:2003,r:'6.7',sy:"Buddy (Will Ferrell) foi criado no Pólo Norte e, apesar de ser um humano, acaba se transformando em um elfo. Após ter problemas na comunidade em que vive, Buddy decide largar tudo e partir rumo a Nova York. Seu objetivo é encontrar Walter (James Caan), seu pai, mas logo se decepciona ao saber que ele é um grande sovina e não acredita em Papai Noel.",p:TI+'w500/zZVJr3jAueYRSiaKx98gzzRpFGp.jpg',b:TI+'w1280/5nhp41gx49vXjwXuDXJwQrRFsng.jpg',em:EMB(10719),tr:'https://www.youtube.com/embed/14o38xfHlXc'},
{id:546554,tmdb:546554,t:'f',g:"Comédia",n:"Entre Facas e Segredos",on:"Knives Out",y:2019,r:'7.8',sy:"Após comemorar 85 anos de idade, o famoso escritor de histórias policiais Harlan Thrombey é encontrado morto dentro de sua propriedade. Logo, o detetive Benoit Blanc é contratado para investigar o caso e descobre que, entre os funcionários misteriosos e a família conflituosa de Harlan, todos podem ser considerados suspeitos do crime.",p:TI+'w500/9H8PNc4JJRjPnfSh8gGukD0CbqQ.jpg',b:TI+'w1280/4HWAQu28e2yaWrtupFPGFkdNU7V.jpg',em:EMB(546554),tr:'https://www.youtube.com/embed/qOg3AoRc4nI'},

const HB=['radial-gradient(circle at 50% 28%,#e0a93c,transparent 16%),radial-gradient(circle at 50% 55%,#5b3fd1,#1a1052 48%,#05010f)','radial-gradient(circle at 30% 30%,#ff3b3b,#4a0010 52%,#050005)','radial-gradient(circle at 70% 30%,#19c3b1,#0b3b4a 52%,#02080c)','radial-gradient(circle at 50% 40%,#ff9d2e,#5a1d00 55%,#060200)'];
const HS=()=>{const h=DB.filter(x=>x.b);return(h.length?h:['f','s','a','f'].map((t,i)=>by(t,gens(t)[0])[i>2?1:0])).filter(Boolean).slice(0,4)};
const hero=()=>{const h=HS();return `<div class="hero">${h.map((x,i)=>`<div class="sl${i?'':' on'}" style="background:${x.b?`url('${x.b}') center/cover`:HB[i%4]}">${x.b?'':`<div class="ht">${x.n}</div>`}</div>`).join('')}<button class="as">Assista</button><div class="dots">${h.map((_,i)=>`<i class="${i?'':'on'}" data-h="${i}"></i>`).join('')}</div></div>`};
const sl=i=>{const L=$$('.sl'),D=$$('.dots i');if(!L.length)return;st.hi=i%L.length;L.forEach((e,k)=>e.classList.toggle('on',k==st.hi));D.forEach((e,k)=>e.classList.toggle('on',k==st.hi))};
function hv(){clearInterval(st.iv);if(st.tab=='t'&&$('.hero'))st.iv=setInterval(()=>sl(st.hi+1),5000)}
const prof=()=>{const f=DB.filter(x=>st.fav.includes(x.id));return `<div class="pv"><img class="av pa" src="${avSrc(st.av)}" alt=""><h2>Visitante</h2><p>Escolha seu avatar</p><div class="ag">${[0,1,2,3,4,5,6,...(S.g('avc',0)?[7]:[])].map(i=>`<button class="ab${i==st.av?' on':''}" data-a="${i}" aria-label="Avatar ${i+1}"><img src="${avSrc(i)}" alt=""></button>`).join('')}<button class="ab add" id="addp" aria-label="Adicionar foto da galeria">${I('M4 8h3l2-3h6l2 3h3v11H4zM12 11a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7')}</button></div></div>${f.length?sec('Meus Favoritos',f):'<p class="em">Toque no + ao assistir para adicionar aos favoritos.</p>'}`};
function draw(){if(!navigator.onLine){$('#v').innerHTML=`<div class="off"><img src="${KON}" alt=""><span>Sem conexão</span></div>`;return}const q=$('#q').value.trim().toLowerCase(),t=st.tab;let h='';
 if(q){const L=DB.filter(x=>x.n.toLowerCase().includes(q)),kk=x=>(x.t=='f'?'f':'s')+(x.tmdb||x.id),k=new Set(L.map(kk));h=gv('Resultados',L.concat(XT.filter(x=>!k.has(kk(x))&&k.add(kk(x)))));tmSearch(q)}
 else if(t=='p')h=prof();
 else if(t=='t')h=hero()+['f','s','a'].map(k=>{const g=gens(k)[0];return sec(k=='f'?'Top Lançamentos<br>Filmes':g,by(k,g),k+'|'+g)}).join('');
 else h=gens(t).map(g=>sec(g,by(t,g),t+'|'+g)).join('');
 $('#v').innerHTML=h;st.hi=0;hv()}
function go(t,sl){if(!sl)tabHist(t);st.tab=t;$('#q').value='';$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('.sr').hidden=t=='p';draw();scrollTo({top:0,behavior:'smooth'})}
$('#q').oninput=draw;addEventListener('online',draw);addEventListener('offline',draw);$('#hp').onclick=$('#hq').onclick=()=>go('p');
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-m],[data-t],[data-a],[data-h],.as,#bk,#addp');if(!t)return;
 if(t.id=='addp')return $('#fi').click();
 if(t.matches('.as')){const h=HS()[st.hi];return h&&open(h.id)}
 if(t.dataset.id)return open(+t.dataset.id);
 if(t.dataset.m){const[k,g]=t.dataset.m.split('|');return openGrid(g,by(k,g))}
 if(t.dataset.t)return go(t.dataset.t);
 if(t.dataset.a!=null){setAv(+t.dataset.a);return $$('.ab').forEach(b=>b.classList.toggle('on',b.dataset.a==st.av))}
 if(t.dataset.h!=null){sl(+t.dataset.h);return hv()}
 if(t.id=='bk')back()});
let x0=0;$('#v').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
$('#v').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(e.target.closest('.hero')&&Math.abs(d)>40){sl(d<0?st.hi+1:st.hi+HS().length-1);hv()}});
// NAV-START (botão voltar do celular: fecha camadas do app antes de sair)
const OV=[];let tp=0,mute=0;
const pushOv=f=>{OV.push(f);history.pushState(0,'')},back=()=>history.back();
function tabHist(t){if(t!='t'&&!tp){tp=1;history.pushState(0,'')}else if(t=='t'&&tp){tp=0;mute=1;setTimeout(()=>mute=0,700);history.go(-1)}}
addEventListener('popstate',()=>{if(mute){mute=0;return}if(OV.length){OV.pop()();return}if(tp){tp=0;go('t',1)}});
// NAV-END
// Aviso do Telegram
$('#tg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.s){SOC[b.dataset.s]&&ext(SOC[b.dataset.s]);return}
 if(b.id=='tgo')ext(TG);
 if(b.id=='tgo'||b.id=='ign')back()});
