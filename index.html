<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>CGzone Play</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
<style>
:root{--r:#ff4d4d;--g:#8c8c8c;--e:cubic-bezier(.34,1.56,.64,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:calc(min(100vw,520px)/108);background:#000;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:400 3.6rem Prompt,system-ui,sans-serif;color:#fff;background:#000;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .25s var(--e),color .3s,border-color .3s}
button:active{transform:scale(.92)}
svg{display:block}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(5rem) scale(.94)}}
@keyframes pop{0%{transform:scale(.5) rotate(-20deg)}60%{transform:scale(1.3) rotate(8deg)}}
@keyframes zoom{from{opacity:0;transform:scale(.8) translateY(6rem)}}
#app{width:min(100vw,520px);margin:0 auto;padding-bottom:16rem}
.hd{display:flex;align-items:center;height:23.8rem;padding:0 4.6rem;border-bottom:.2rem solid #3a3a3a}
.hav{width:17.2rem;height:17.2rem;flex:none;border-radius:50%;border:.4rem solid #8a8a8a;object-fit:cover;background:#000;animation:pop .7s var(--e)}
.hd h1{font:600 5.8rem Prompt;margin:0 2.4rem 0 2.8rem}
.pl{height:9.8rem;padding:0 2rem;border:.3rem solid #ff1a1a;border-radius:2.2rem;color:#ff1a1a;font:500 5.8rem/1 Prompt;display:grid;place-items:center}
.pls{margin-left:auto;width:7.4rem;height:7.4rem;flex:none;border:.25rem solid var(--g);border-radius:1.4rem;display:grid;place-items:center;color:#c8c8c8}
.pls svg{width:5rem;height:5rem;margin:auto}
.pf{margin-left:5.5rem;width:18.9rem;height:11.1rem;flex:none;border:.3rem solid #fff;border-radius:5.6rem;display:grid;place-items:center;overflow:hidden}
.pf img{width:11rem;height:9.6rem;object-fit:cover}
.sr{display:flex;align-items:center;gap:2.2rem;margin:4rem 6.2rem 0;height:10.5rem;padding:0 4.6rem;border:.3rem solid #3a3a3a;border-radius:5.3rem;background:#141414;color:#d0d0d0;transition:border-color .3s}
.sr:focus-within{border-color:var(--r)}
.sr svg{width:5.8rem;height:5.8rem;flex:none}
.sr input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:400 3.8rem Prompt}
.sr input::placeholder{color:#d0d0d0}
.hero{position:relative;margin-top:2.8rem;height:115rem;border-radius:6rem;overflow:hidden;background:#05050f;animation:fade .5s}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity .8s,transform 6s linear}
.sl.on{opacity:1;transform:none}
.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65))}
.ht{position:absolute;z-index:1;left:0;right:0;bottom:27rem;padding:0 5rem;text-align:center;font:600 7.6rem/1.05 Prompt;text-shadow:0 .4rem 3rem #000}
.as{position:absolute;z-index:2;left:50%;bottom:10.2rem;margin-left:-24.8rem;width:49.6rem;height:13.7rem;border:.3rem solid rgba(255,255,255,.55);border-radius:7rem;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);font:500 5.2rem Prompt}
.dots{position:absolute;z-index:2;bottom:4.2rem;left:0;right:0;display:flex;justify-content:center;gap:1.2rem}
.dots i{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;cursor:pointer;transition:transform .3s var(--e),background .3s}
.dots i.on{background:#999;transform:scale(1.15)}
.sec{margin-top:7rem;animation:fade .4s}
#v>.sec:first-child{margin-top:5rem}
.hero+.sec{margin-top:10rem}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 5rem 0 5.7rem}
.sh h2{font:500 4.6rem/6.8rem Prompt}
.sh button{color:var(--r);font:500 3.8rem Prompt}
.row{display:flex;gap:4.8rem;overflow-x:auto;padding:1.4rem 3.7rem;scroll-padding-left:3.7rem;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.cd{flex:0 0 40.5rem;height:55.7rem;border:.3rem solid var(--g);border-radius:5rem;background:#000 center/cover;display:grid;place-items:center;scroll-snap-align:start;animation:up .6s var(--e) both;animation-delay:calc(var(--i)*70ms)}
.cd svg{width:13.2rem;height:13.2rem;transition:transform .3s var(--e)}
.cd:active svg{transform:scale(1.25)}
nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,520px);display:grid;grid-template-columns:repeat(5,1fr);background:#000;border-top:.2rem solid #3a3a3a;padding:1.2rem 0 env(safe-area-inset-bottom,0px)}
nav button{display:grid;justify-items:center;gap:.4rem;font:500 3.1rem Prompt;color:#fff}
nav svg{width:6.4rem;height:6.4rem}
nav .on{color:var(--r)}
nav .on svg{animation:pop .5s var(--e)}
.gv{padding:5rem 5rem 0;animation:fade .4s}
.gh{display:flex;align-items:center;gap:2rem;margin-bottom:3rem}
.gh h2{font:500 4.6rem Prompt}
.bk{width:8rem;height:8rem;display:grid;place-items:center}
.bk svg{width:5rem;height:5rem}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:4rem}
.gr .cd{width:100%;height:auto;aspect-ratio:405/557}
.gr p{font-size:3.2rem;margin-top:1.4rem;color:#ddd}
.pv{text-align:center;padding:8rem 5rem 0;animation:fade .4s}
.pa{width:30rem;height:30rem;border-radius:50%;border:.5rem solid #8a8a8a;object-fit:cover;background:#000;margin:0 auto}
.pv h2{font:600 5.2rem Prompt;margin:3rem 0 1rem}
.pv p{color:#aaa;font-size:3.4rem;margin-bottom:4rem}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:3.4rem;margin-bottom:6rem}
.ab{border-radius:50%;border:.4rem solid #333;overflow:hidden;aspect-ratio:1;transition:border-color .3s,transform .3s var(--e)}
.ab img{width:100%;height:100%;object-fit:cover}
.ab.on{border-color:var(--r);transform:scale(1.1)}
.em{color:#777;font-size:3.2rem;text-align:center;padding:0 5rem}
.mo{position:fixed;inset:0;z-index:20;display:flex;overflow:auto;padding:2rem;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);animation:fade .3s}
.mo.out{opacity:0;transition:opacity .3s}
.mc{position:relative;margin:auto;width:89.3rem;max-width:100%;padding:14.9rem 7.8rem 9.4rem;border-radius:6.2rem;background:#2d2d2d;overflow:hidden;animation:zoom .5s var(--e)}
.mc>*{position:relative}
.mc>.mb{position:absolute;inset:0 0 auto;height:35rem;background:center/cover;opacity:.32;-webkit-mask:linear-gradient(#000 55%,transparent);mask:linear-gradient(#000 55%,transparent)}
.tp{display:flex;align-items:center;height:21.2rem;margin:0 -1.3rem 7.3rem}
.mav{width:21.2rem;height:21.2rem;flex:none;border-radius:50%;object-fit:cover;background:#000}
.vl{width:.8rem;height:12rem;flex:none;border-radius:.4rem;background:#fff;margin:0 4.6rem 0 3rem}
.so{flex:1;display:flex;gap:2.5rem;align-items:center;justify-content:center;height:19rem;border:.3rem solid #8a8a8a;border-radius:3.5rem;background:rgba(20,20,20,.85)}
.so button{width:12.1rem;height:12.1rem;border-radius:3rem;display:grid;place-items:center}
.tx{padding:3.5rem 7rem;border:.3rem solid #8a8a8a;border-radius:4rem;background:#1b1b1b;font:400 3.8rem/5.05rem Prompt}
.bt{display:flex;justify-content:space-between;margin-top:10rem}
.bt button{width:33.9rem;height:15.8rem;border-radius:3.8rem;background:linear-gradient(145deg,#3d3d3d,#000);box-shadow:0 1.5rem 4rem #0009;font:500 5.2rem Prompt}
.tst{position:fixed;z-index:30;left:50%;bottom:16rem;transform:translateX(-50%);max-width:90vw;background:#222;border:1px solid #444;padding:1.4rem 3rem;border-radius:4rem;font-size:3.2rem;text-align:center;animation:fade .3s}
#pl{position:fixed;inset:0;z-index:15;background:#000;overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.2,1),visibility 0s .5s}
#pl.on{transform:none;visibility:visible;transition-delay:0s}
.pw{max-width:520px;margin:0 auto;padding-bottom:60px}
.stage{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.stage:fullscreen{aspect-ratio:auto}
.stage video{width:100%;height:100%;object-fit:contain;transition:filter .2s}
.ct{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000b,transparent 30%,transparent 55%,#000c);opacity:0;pointer-events:none;transition:opacity .3s}
.show .ct{opacity:1;pointer-events:auto}
.tb{display:flex;align-items:center;gap:6px;padding:6px 6px 0}
.tb b{flex:1;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ib svg{width:24px;height:24px}
.big{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center}
.big svg{width:30px;height:30px;stroke-linejoin:round}
.bb{padding:0 12px 6px}
.bb input{width:100%;accent-color:var(--r);height:18px}
.cr{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.cr>span:last-child{display:flex;align-items:center}
.skip{position:absolute;right:12px;bottom:74px;display:none;padding:8px 14px;border:1px solid #fff9;border-radius:20px;background:#0008;font-size:12px}
.skip.on{display:block;animation:up .4s var(--e)}
.mn{position:absolute;right:12px;bottom:58px;z-index:3;padding:10px 12px;border-radius:14px;background:#161616ee;border:1px solid #3a3a3a;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mn button{padding:5px 10px;text-align:left}
.mn .on{color:var(--r)}
.pi{padding:16px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tr h2{font:600 22px Prompt}
.pi .pls{width:40px;height:40px;margin:0;border-radius:10px}
.pi .pls svg{width:28px;height:28px}
.pi .pls.on{border-color:var(--r);color:var(--r);animation:pop .5s var(--e)}
.mt{color:#aaa;font-size:13px;margin:4px 0 10px}
.pi p{color:#ddd;font-size:14px;line-height:1.6}
.ch{display:flex;gap:8px;margin:16px 0 10px;overflow-x:auto;scrollbar-width:none}
.ch button{flex:none;padding:7px 16px;border:1px solid var(--g);border-radius:20px;font-size:13px}
.ch .on{border-color:var(--r);color:var(--r)}
.ep{display:flex;gap:12px;align-items:center;width:100%;padding:12px;margin-bottom:8px;border:1px solid #2c2c2c;border-radius:14px;background:#0f0f0f;text-align:left;font-size:14px}
.ep.on{border-color:var(--r)}
.ep i{font-style:normal;color:var(--r);font-weight:600;min-width:22px}
.pi h3{font:500 16px Prompt;margin:20px 0 10px}
.cm{display:flex;gap:10px;margin-bottom:10px;font-size:13px;animation:fade .4s}
.cm img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.cm small{margin-left:6px;color:#888}
.cm span{display:block;margin-top:2px}
.cf{display:flex;gap:8px;margin-top:10px}
.cf input{flex:1;min-width:0;padding:11px 14px;border-radius:20px;border:1px solid #3a3a3a;background:#141414;color:#fff;font:400 14px Prompt;outline:0}
.cf button{padding:0 16px;border-radius:20px;background:var(--r);color:#000;font-weight:500}
#gvo,#cr{position:fixed;inset:0;z-index:12;padding-top:env(safe-area-inset-top,0px);background:#000;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#gvo.on,#cr.on{opacity:1;visibility:visible;transition-delay:0s}
.gvi{width:min(100vw,520px);margin:0 auto;padding-bottom:8rem}
#cr{z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000f}
#cr canvas{touch-action:none;border-radius:16px;background:#111}
#cr p{color:#aaa;font-size:13px;text-align:center;padding:0 24px}
#cr input{width:min(80vw,340px);accent-color:var(--r)}
.crb{display:flex;gap:16px}
.crb button{width:130px;height:50px;border-radius:14px;background:linear-gradient(145deg,#3d3d3d,#000);box-shadow:0 8px 20px #0009;font:500 17px Prompt}
.ab.add{display:grid;place-items:center;color:#ddd;border-style:dashed;border-color:#555}
.ab.add svg{width:42%;height:42%}
button:focus-visible,input:focus-visible{outline:2px solid var(--r);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
<header class="hd"><img class="av hav" alt=""><h1>CGzone</h1><span class="pl">Play</span>
<button class="pls" id="hp" aria-label="Favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M12 4.5v15M4.5 12h15" stroke-linecap="round"/></svg></button>
<button class="pf" id="hq" aria-label="Perfil"><img class="av" alt=""></button></header>
<label class="sr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="q" placeholder="Pesquisar Filme, Série ou Anime…" autocomplete="off" enterkeyhint="search"></label>
<main id="v"></main></div>
<nav></nav><div id="pl"></div><div id="gvo"></div><div id="cr"></div><input type="file" id="fi" accept="image/*" hidden>
<div class="mo" id="tg"><div class="mc"><div class="mb"></div>
<div class="tp"><img class="mav" alt=""><i class="vl"></i><div class="so">
<button data-s="tiktok" style="background:#1a1a1a" aria-label="TikTok"><svg viewBox="0 0 48 48" width="64%" fill="none" stroke-width="5" stroke-linecap="round"><defs><path id="tn" d="M28 8v22a7 7 0 1 1-7-7M28 8c.6 5 3.600 8 9 8.500"/></defs><use href="#tn" stroke="#25f4ee" transform="translate(-2 -2)"/><use href="#tn" stroke="#fe2c55" transform="translate(2 2)"/><use href="#tn" stroke="#fff"/></svg></button>
<button data-s="instagram" style="background:linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5)" aria-label="Instagram"><svg viewBox="0 0 48 48" width="64%" fill="none" stroke="#fff" stroke-width="4"><rect x="8" y="8" width="32" height="32" rx="10"/><circle cx="24" cy="24" r="7.500"/><circle cx="33" cy="15" r="1.800" fill="#fff" stroke="none"/></svg></button>
<button data-s="youtube" style="background:#f00" aria-label="YouTube"><svg viewBox="0 0 48 48" width="56%"><path fill="#fff" d="M17 12l19 12-19 12z"/></svg></button>
</div></div>
<div class="tx">Não perca nenhuma novidade!<br>Entre no canal oficial do Telegram para acompanhar atualizações em primeira mão e muito mais. Clica aí embaixo!</div>
<div class="bt"><button id="ign">Ignorar</button><button id="tgo">Telegram</button></div></div></div>

['#2a003a','<path fill="#bbb" d="M50 28l7 9 15-13-5 21 21-9-11 19-13-4-6 17-8-13-8 13-6-17-13 4L7 36l21 9-5-21 15 13z"/><circle cx="44" cy="44" r="2" fill="#f22"/><circle cx="56" cy="44" r="2" fill="#f22"/>'],
['#0a2a2a','<path fill="#bbb" d="M22 20l18 12h20l18-12-4 30-8 20-14 12H48L34 70l-8-20z"/><path fill="#ffb300" d="M35 50l11 3-9 6zM65 50l-11 3 9 6z"/><path d="M45 72h10l-5 7z"/>'],
['#1c1c1c','<circle cx="50" cy="52" r="32" fill="#222"/><rect x="20" y="42" width="60" height="17" rx="8" fill="#d9c7a5"/><circle cx="38" cy="50" r="3.5"/><circle cx="62" cy="50" r="3.5"/><rect x="19" y="31" width="62" height="8" fill="#b00"/>'],

const avSrc=i=>i==7?S.g('avc',AV0):i?'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g" cx=".5" cy=".3" r=".9"><stop offset="0" stop-color="${AG[i-1][0]}"/><stop offset="1" stop-color="#000"/></radialGradient></defs><rect width="100" height="100" fill="url(#g)"/>${AG[i-1][1]}</svg>`):AV0;

const toast=m=>{const d=document.createElement('div');d.className='tst';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2400)};
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
// Telas
const gens=t=>[...new Set(DB.filter(x=>x.t==t).map(x=>x.g))],by=(t,g)=>DB.filter(x=>x.t==t&&x.g==g);
const card=(x,i)=>`<button class="cd" data-id="${x.id}" aria-label="${x.n}" style="--i:${i};${x.p?`background-image:url('${x.p}')`:''}">${PLAYC}</button>`;
const sec=(h,l,m)=>l.length?`<section class="sec"><div class="sh"><h2>${h}</h2>${m?`<button data-m="${m}">Ver Mais</button>`:''}</div><div class="row">${l.map(card).join('')}</div></section>`:'';
const gv=(h,l,b)=>`<div class="gv"><div class="gh">${b?`<button class="bk" id="bk" aria-label="Voltar">${I('M15 5l-7 7 7 7')}</button>`:''}<h2>${h}</h2></div><div class="gr">${l.map((x,i)=>`<div>${card(x,i)}<p>${x.n}</p></div>`).join('')||'<p>Nada encontrado.</p>'}</div></div>`;
const HB=['radial-gradient(circle at 50% 28%,#e0a93c,transparent 16%),radial-gradient(circle at 50% 55%,#5b3fd1,#1a1052 48%,#05010f)','radial-gradient(circle at 30% 30%,#ff3b3b,#4a0010 52%,#050005)','radial-gradient(circle at 70% 30%,#19c3b1,#0b3b4a 52%,#02080c)','radial-gradient(circle at 50% 40%,#ff9d2e,#5a1d00 55%,#060200)'];
const HS=()=>{const h=DB.filter(x=>x.b);return(h.length?h:['f','s','a','f'].map((t,i)=>by(t,gens(t)[0])[i>2?1:0])).filter(Boolean).slice(0,4)};
const hero=()=>{const h=HS();return `<div class="hero">${h.map((x,i)=>`<div class="sl${i?'':' on'}" style="background:${x.b?`url('${x.b}') center/cover`:HB[i%4]}">${x.b?'':`<div class="ht">${x.n}</div>`}</div>`).join('')}<button class="as">Assista</button><div class="dots">${h.map((_,i)=>`<i class="${i?'':'on'}" data-h="${i}"></i>`).join('')}</div></div>`};
const sl=i=>{const L=$$('.sl'),D=$$('.dots i');if(!L.length)return;st.hi=i%L.length;L.forEach((e,k)=>e.classList.toggle('on',k==st.hi));D.forEach((e,k)=>e.classList.toggle('on',k==st.hi))};
function hv(){clearInterval(st.iv);if(st.tab=='t'&&$('.hero'))st.iv=setInterval(()=>sl(st.hi+1),5000)}
const prof=()=>{const f=DB.filter(x=>st.fav.includes(x.id));return `<div class="pv"><img class="av pa" src="${avSrc(st.av)}" alt=""><h2>Visitante</h2><p>Escolha seu avatar</p><div class="ag">${[0,1,2,3,4,5,6,...(S.g('avc',0)?[7]:[])].map(i=>`<button class="ab${i==st.av?' on':''}" data-a="${i}" aria-label="Avatar ${i+1}"><img src="${avSrc(i)}" alt=""></button>`).join('')}<button class="ab add" id="addp" aria-label="Adicionar foto da galeria">${I('M4 8h3l2-3h6l2 3h3v11H4zM12 11a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7')}</button></div></div>${f.length?sec('Meus Favoritos',f):'<p class="em">Toque no + ao assistir para adicionar aos favoritos.</p>'}`};
function draw(){const q=$('#q').value.trim().toLowerCase(),t=st.tab;let h='';
 if(q)h=gv('Resultados',DB.filter(x=>x.n.toLowerCase().includes(q)));
 else if(t=='p')h=prof();
 else if(t=='t')h=hero()+['f','s','a'].map(k=>{const g=gens(k)[0];return sec(k=='f'?'Top Lançamentos<br>Filmes':g,by(k,g),k+'|'+g)}).join('');
 else h=gens(t).map(g=>sec(g,by(t,g),t+'|'+g)).join('');
 $('#v').innerHTML=h;st.hi=0;hv()}
function go(t,sl){if(!sl)tabHist(t);st.tab=t;$('#q').value='';$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('.sr').hidden=t=='p';draw();scrollTo({top:0,behavior:'smooth'})}
$('#q').oninput=draw;$('#hp').onclick=$('#hq').onclick=()=>go('p');
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-m],[data-t],[data-a],[data-h],.as,#bk,#addp');if(!t)return;
 if(t.id=='addp')return $('#fi').click();
 if(t.matches('.as')){const h=HS()[st.hi];return h&&open(h.id)}
 if(t.dataset.id)return open(+t.dataset.id);
 if(t.dataset.m){const[k,g]=t.dataset.m.split('|');return openGrid(g,by(k,g))}
 if(t.dataset.t)return go(t.dataset.t);
 if(t.dataset.a!=null){setAv(+t.dataset.a);return $$('.ab').forEach(b=>b.classList.toggle('on',b.dataset.a==st.av))}
 if(t.dataset.h!=null){sl(+t.dataset.h);return hv()}
 if(t.id=='bk')back()});
let x0=0;$('#v').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
$('#v').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(e.target.closest('.hero')&&Math.abs(d)>40){sl(d<0?st.hi+1:st.hi+HS().length-1);hv()}});
// NAV-START (botão voltar do celular: fecha camadas do app antes de sair)
const OV=[];let tp=0,mute=0;
const pushOv=f=>{OV.push(f);history.pushState(0,'')},back=()=>history.back();
function tabHist(t){if(t!='t'&&!tp){tp=1;history.pushState(0,'')}else if(t=='t'&&tp){tp=0;mute=1;setTimeout(()=>mute=0,700);history.go(-1)}}
addEventListener('popstate',()=>{if(mute){mute=0;return}if(OV.length){OV.pop()();return}if(tp){tp=0;go('t',1)}});
// NAV-END
// Aviso do Telegram
$('#tg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.s){SOC[b.dataset.s]&&ext(SOC[b.dataset.s]);return}
 if(b.id=='tgo')ext(TG);
 if(b.id=='tgo'||b.id=='ign')back()});
// Player
function open(id){const x=cur=DB.find(i=>i.id==id);if(!x)return;const P=$('#pl'),ser=x.t!='f';
 const SE=x.seasons||[1,2].map(()=>Array.from({length:6},(_,i)=>({n:'Episódio '+(i+1),u:x.u})));
 let s=0,e=0,qd=Object.keys(x.u)[1]||Object.keys(x.u)[0];
 const PPI=p=>I(p?'M8 5l11 7-11 7z':'M8 5v14M16 5v14');
 P.innerHTML=`<div class="pw"><div class="stage show" id="sg"><video id="vd" playsinline ${x.b?`poster="${x.b}"`:''}></video><div class="ct">
 <div class="tb"><button class="ib" id="pb" aria-label="Voltar">${I('M15 5l-7 7 7 7')}</button><b>${x.n}</b><button class="ib" id="cb" aria-label="Transmitir para a TV (Web Video Caster)">${I(CST)}</button></div>
 <button class="big" id="pp" aria-label="Reproduzir ou pausar">${PPI(1)}</button>
 <button class="skip" id="sk">Pular abertura</button>
 <div class="mn" id="pq" hidden></div><div class="mn" id="pr" hidden><input type="range" id="br" min="40" max="160" value="100" style="width:130px;accent-color:var(--r)" aria-label="Brilho"></div>
 <div class="bb"><input type="range" id="sb" min="0" max="1000" value="0" aria-label="Progresso"><div class="cr"><span id="tm">0:00 / 0:00</span><span><button class="ib" id="bb2" aria-label="Brilho">${I(SUN)}</button><button class="ib" id="qb" style="font-size:13px;font-weight:600" aria-label="Resolução">${qd}</button><button class="ib" id="fb" aria-label="Tela cheia">${I(FSP)}</button></span></div></div></div></div>
 <div class="pi"><div class="tr"><h2>${x.n}</h2><button class="pls" id="fv" aria-label="Favoritar"></button></div><div class="mt">${x.y} · ${TN[x.t]} · ${x.g}</div><p>${x.sy}</p>
 ${ser?`<div class="ch" id="sn">${SE.map((_,i)=>`<button data-s="${i}" class="${i?'':'on'}">Temporada ${i+1}</button>`).join('')}</div><div id="el"></div>`:''}
 <h3>${ser?'Chat do episódio':'Chat do filme'}</h3><div id="cmx"></div><div class="cf"><input id="ci" placeholder="O que achou?" maxlength="240"><button id="cs">Enviar</button></div></div></div>`;
 const vd=$('#vd'),sg=$('#sg'),f=t=>isFinite(t)?`${t/60|0}:${String(t%60|0).padStart(2,'0')}`:'0:00',U=()=>(ser?SE[s][e].u:0)||x.u,ck=()=>`ch:${x.id}:${s}:${e}`;
 const T=()=>{clearTimeout(sg._t);sg.classList.add('show');if(!vd.paused)sg._t=setTimeout(()=>sg.classList.remove('show'),3000)};
 const ld=(q,keep)=>{const t=keep?vd.currentTime:0,w=keep?!vd.paused:true,u=U();vd.src=u[q]||Object.values(u)[0];vd.onloadedmetadata=()=>{try{vd.currentTime=t}catch{}w&&vd.play().catch(()=>{})}};
 const epl=()=>{$('#el').innerHTML=SE[s].map((p,i)=>`<button class="ep${i==e?' on':''}" data-e="${i}"><i>${i+1}</i>${p.n}</button>`).join('')};
 const cm=()=>{const L=S.g(ck(),[]);$('#cmx').innerHTML=L.length?L.map(c=>`<div class="cm"><img src="${avSrc(c.a)}" alt=""><div><b>${c.u}</b><small>${c.t}</small><span>${esc(c.x)}</span></div></div>`).join(''):'<p style="color:#777;font-size:13px">Seja o primeiro a comentar.</p>'};
 const fvd=()=>{const on=st.fav.includes(x.id),b=$('#fv');b.classList.toggle('on',on);b.innerHTML=I(on?'M5 12l5 5 9-10':'M12 5v14M5 12h14')};
 vd.onplay=vd.onpause=()=>{$('#pp').innerHTML=PPI(vd.paused);T()};
 vd.onerror=()=>toast('Não foi possível carregar o vídeo. Confira a URL em "u".');
 vd.ontimeupdate=()=>{$('#sb').value=vd.duration?vd.currentTime/vd.duration*1000:0;$('#tm').textContent=f(vd.currentTime)+' / '+f(vd.duration);$('#sk').classList.toggle('on',vd.currentTime>1&&vd.currentTime<(x.intro?.[1]||90))};
 $('#sb').oninput=ev=>{if(vd.duration)vd.currentTime=ev.target.value/1000*vd.duration};
 $('#pp').onclick=()=>vd.paused?vd.play():vd.pause();
 $('#sk').onclick=()=>vd.currentTime=x.intro?.[1]||90;
 sg.onclick=ev=>{if(ev.target.closest('button,input,.mn'))return;sg.classList.contains('show')&&!vd.paused?sg.classList.remove('show'):T()};
 $('#qb').onclick=()=>{const m=$('#pq');m.hidden=!m.hidden;$('#pr').hidden=true;m.innerHTML=[...new Set(['Auto',...Object.keys(U())])].map(q=>`<button class="${q==qd?'on':''}" data-q="${q}">${q}</button>`).join('')};
 $('#pq').onclick=ev=>{const q=ev.target.dataset.q;if(!q)return;qd=q;$('#qb').textContent=q;$('#pq').hidden=true;ld(q,1)};
 $('#bb2').onclick=()=>{$('#pr').hidden=!$('#pr').hidden;$('#pq').hidden=true};
 $('#br').oninput=ev=>vd.style.filter=`brightness(${ev.target.value}%)`;
 $('#fb').onclick=()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else if(sg.requestFullscreen){sg.requestFullscreen();screen.orientation?.lock?.('landscape').catch(()=>{})}else if(sg.webkitRequestFullscreen)sg.webkitRequestFullscreen();else vd.webkitEnterFullscreen?.()};
 $('#cb').onclick=()=>{location.href='wvc-x-callback://open?url='+encodeURIComponent(vd.currentSrc||vd.src)+'&title='+encodeURIComponent(x.n);setTimeout(()=>{if(!document.hidden)toast('Instale o Web Video Caster para transmitir à TV')},1800)};
 $('#fv').onclick=()=>{st.fav=st.fav.includes(x.id)?st.fav.filter(i=>i!=x.id):[...st.fav,x.id];S.s('fav',st.fav);fvd();toast(st.fav.includes(x.id)?'Adicionado aos favoritos':'Removido dos favoritos')};
 $('#cs').onclick=()=>{const i=$('#ci'),v=i.value.trim();if(!v)return;const L=S.g(ck(),[]);L.push({u:'Você',a:st.av,x:v,t:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});S.s(ck(),L);i.value='';cm()};
 $('#ci').onkeydown=ev=>ev.key=='Enter'&&$('#cs').click();
 if(ser){$('#sn').onclick=ev=>{const b=ev.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;e=0;$$('#sn button').forEach(k=>k.classList.toggle('on',k==b));epl();cm();ld(qd)};
  $('#el').onclick=ev=>{const b=ev.target.closest('[data-e]');if(!b)return;e=+b.dataset.e;epl();cm();ld(qd)};epl()}
 const cl=()=>{vd.onerror=null;vd.pause();vd.removeAttribute('src');vd.load();P.classList.remove('on');if(document.fullscreenElement)document.exitFullscreen()};$('#pb').onclick=back;
 P.scrollTop=0;cm();fvd();ld(qd);requestAnimationFrame(()=>P.classList.add('on'));pushOv(cl)}
function openGrid(h,l){const g=$('#gvo');g.innerHTML=`<div class="gvi">${gv(h,l,1)}</div>`;g.scrollTop=0;requestAnimationFrame(()=>g.classList.add('on'));pushOv(()=>g.classList.remove('on'))}
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)crop(f)};
function crop(file){const url=URL.createObjectURL(file),img=new Image(),C=$('#cr');
 img.onerror=()=>{URL.revokeObjectURL(url);toast('Não foi possível abrir a imagem')};
 img.onload=()=>{const SZ=Math.round(Math.min(innerWidth*.86,360)),R=SZ/2-8,dp=devicePixelRatio||1,w=img.naturalWidth,h=img.naturalHeight,sm=2*R/Math.min(w,h);let s=sm,cx=SZ/2,cy=SZ/2;
  C.innerHTML=`<b style="font:500 18px Prompt">Ajustar foto</b><canvas id="cv"></canvas><input type="range" id="zr" min="1" max="5" step="0.01" value="1" aria-label="Zoom"><p>Arraste para mover. Use pinça ou a barra para o zoom.</p><div class="crb"><button id="cc">Cancelar</button><button id="cp">Salvar</button></div>`;
  const cv=$('#cv'),x=cv.getContext('2d');cv.width=cv.height=SZ*dp;cv.style.width=cv.style.height=SZ+'px';x.setTransform(dp,0,0,dp,0,0);
  const fit=()=>{s=Math.min(Math.max(s,sm),sm*5);const hw=w*s/2,hh=h*s/2;cx=Math.min(Math.max(cx,SZ/2+R-hw),SZ/2-R+hw);cy=Math.min(Math.max(cy,SZ/2+R-hh),SZ/2-R+hh);$('#zr').value=s/sm};
  const dr=()=>{fit();x.clearRect(0,0,SZ,SZ);x.drawImage(img,cx-w*s/2,cy-h*s/2,w*s,h*s);x.beginPath();x.rect(0,0,SZ,SZ);x.arc(SZ/2,SZ/2,R,0,7,true);x.fillStyle='rgba(0,0,0,.65)';x.fill('evenodd');x.beginPath();x.arc(SZ/2,SZ/2,R,0,7);x.strokeStyle='#fff';x.lineWidth=2;x.stroke()};
  const M=new Map();let d0=1,s0=1;
  cv.onpointerdown=ev=>{cv.setPointerCapture(ev.pointerId);M.set(ev.pointerId,[ev.clientX,ev.clientY]);if(M.size==2){const[a,b]=[...M.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1])||1;s0=s}};
  cv.onpointermove=ev=>{const o=M.get(ev.pointerId);if(!o)return;M.set(ev.pointerId,[ev.clientX,ev.clientY]);if(M.size==1){cx+=ev.clientX-o[0];cy+=ev.clientY-o[1]}else if(M.size==2){const[a,b]=[...M.values()];s=s0*Math.hypot(a[0]-b[0],a[1]-b[1])/d0}dr()};
  cv.onpointerup=cv.onpointercancel=ev=>M.delete(ev.pointerId);
  $('#zr').oninput=ev=>{s=sm*ev.target.value;dr()};$('#cc').onclick=back;
  $('#cp').onclick=()=>{const o=document.createElement('canvas');o.width=o.height=320;const k=320/(2*R),ox=SZ/2-R;o.getContext('2d').drawImage(img,(cx-w*s/2-ox)*k,(cy-h*s/2-ox)*k,w*s*k,h*s*k);S.s('avc',o.toDataURL('image/jpeg',.88));setAv(7);back();if(st.tab=='p')draw();toast('Foto salva')};
  dr();requestAnimationFrame(()=>C.classList.add('on'));pushOv(()=>{C.classList.remove('on');URL.revokeObjectURL(url)})};
 img.src=url}
// Início
$$('.mav').forEach(i=>i.src=AV0);$('.mb').style.backgroundImage=`url(${BN})`;
setAv(st.av);go('t');pushOv(()=>{const m=$('#tg');if(m){m.classList.add('out');setTimeout(()=>m.remove(),300)}});
</script></body></html>
